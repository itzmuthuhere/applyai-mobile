name: Build APK + Update Download Page

on:
  workflow_dispatch:
    inputs:
      version_note:
        description: 'What changed in this build? (shown on download page)'
        required: false
        default: 'Latest build'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK via EAS
        id: eas_build
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --no-wait=false \
            2>&1)
          echo "$BUILD_OUTPUT"
          APK_URL=$(echo "$BUILD_OUTPUT" | python3 -c "
          import sys, json, re
          text = sys.stdin.read()
          # Try to find URL in JSON output
          try:
              data = json.loads(text)
              if isinstance(data, list):
                  print(data[0].get('artifacts', {}).get('buildUrl', ''))
              elif isinstance(data, dict):
                  print(data.get('artifacts', {}).get('buildUrl', ''))
          except:
              # fallback: grep for expo.dev artifact URL
              match = re.search(r'https://expo\.dev/artifacts/eas/[^\s]+\.apk', text)
              if match:
                  print(match.group(0))
          " 2>/dev/null || echo "")
          # If above fails, fetch latest build URL from EAS
          if [ -z "$APK_URL" ]; then
            APK_URL=$(eas build:list \
              --platform android \
              --status finished \
              --limit 1 \
              --json \
              --non-interactive 2>/dev/null | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['artifacts']['buildUrl'])" 2>/dev/null || echo "")
          fi
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "APK URL: $APK_URL"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get current date and version
        id: meta
        run: |
          echo "date=$(date +'%B %d, %Y')" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update download page with new APK URL
        run: |
          APK_URL="${{ steps.eas_build.outputs.apk_url }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DATE="${{ steps.meta.outputs.date }}"
          SHA="${{ steps.meta.outputs.short_sha }}"
          NOTE="${{ github.event.inputs.version_note }}"

          python3 - <<EOF
          import re

          with open('docs/index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          # Update APK download href
          content = re.sub(
              r'href="[^"]*"(\s*\n\s*id="downloadBtn")',
              f'href="{APK_URL}"\\1',
              content
          )

          # Update version badge
          content = re.sub(r'<span>v[\d.]+</span>', f'<span>v{VERSION}</span>', content)

          # Update build note in version info
          if '<span class="build-note">' in content:
              content = re.sub(
                  r'<span class="build-note">[^<]*</span>',
                  f'<span class="build-note">{NOTE} · {DATE} · #{SHA}</span>',
                  content
              )
          else:
              content = content.replace(
                  '<span>~50 MB</span>',
                  f'<span>~50 MB</span>\n      <br/><span class="build-note" style="font-size:11px;color:#94A3B8;">{NOTE} · {DATE} · #{SHA}</span>'
              )

          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(content)

          print(f"Updated download page: v{VERSION} → {APK_URL}")
          EOF

      - name: Commit updated download page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "chore: update download page → APK v${{ steps.meta.outputs.version }} (#${{ steps.meta.outputs.short_sha }})" || echo "No changes to commit"
          git push
