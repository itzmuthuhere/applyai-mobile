name: Build APK + Update Download Page

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'android/**'
      - 'assets/**'
      - 'babel.config.js'
  workflow_dispatch:
    inputs:
      version_note:
        description: 'What changed in this build?'
        required: false
        default: 'Latest build'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > google-services.json

      - name: Build APK via EAS
        id: eas_build
        run: |
          BUILD_JSON=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            2>&1)
          echo "$BUILD_JSON"

          APK_URL=$(echo "$BUILD_JSON" | python3 -c "
          import sys, json
          text = sys.stdin.read()
          for line in reversed(text.strip().split('\n')):
              try:
                  data = json.loads(line)
                  if isinstance(data, list) and len(data) > 0:
                      url = data[0].get('artifacts', {}).get('buildUrl', '')
                      if url: print(url); break
                  elif isinstance(data, dict):
                      url = data.get('artifacts', {}).get('buildUrl', '')
                      if url: print(url); break
              except: continue
          " 2>/dev/null || echo "")

          if [ -z "$APK_URL" ]; then
            echo "Falling back to eas build:list..."
            APK_URL=$(eas build:list \
              --platform android \
              --status finished \
              --limit 1 \
              --json \
              --non-interactive 2>/dev/null | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['artifacts']['buildUrl'])" 2>/dev/null || echo "")
          fi

          if [ -z "$APK_URL" ]; then
            echo "ERROR: Could not extract APK URL"
            exit 1
          fi

          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "APK URL: $APK_URL"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get build metadata
        id: meta
        run: |
          echo "date=$(date +'%b %d, %Y')" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT
          NOTE="${{ github.event.inputs.version_note }}"
          if [ -z "$NOTE" ]; then NOTE="${{ github.event.head_commit.message }}"; fi
          echo "note=${NOTE}" >> $GITHUB_OUTPUT

      - name: Update Netlify download page
        run: |
          python3 - <<'PYEOF'
          import re, os

          apk_url = os.environ['APK_URL']
          version = os.environ['VERSION']
          date    = os.environ['DATE']
          sha     = os.environ['SHA']
          note    = os.environ['NOTE']

          with open('docs/index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(
              r'href="[^"]*"(\s*\n?\s*id="downloadBtn")',
              f'href="{apk_url}"\\1',
              content
          )
          content = re.sub(r'<span>v[\d.]+</span>', f'<span>v{version}</span>', content)

          if 'id="buildInfo"' in content:
              content = re.sub(
                  r'<span id="buildInfo">[^<]*</span>',
                  f'<span id="buildInfo">{note} · {date} · #{sha}</span>',
                  content
              )
          else:
              content = content.replace(
                  '<span>~50 MB</span>',
                  f'<span>~50 MB</span>\n      <br/><span id="buildInfo" style="font-size:11px;color:#94A3B8;">{note} · {date} · #{sha}</span>'
              )

          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(content)

          print(f"Updated: v{version} -> {apk_url}")
          PYEOF
        env:
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
          SHA: ${{ steps.meta.outputs.short_sha }}
          NOTE: ${{ steps.meta.outputs.note }}

      - name: Commit updated download page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update download page → APK v${{ steps.meta.outputs.version }} (#${{ steps.meta.outputs.short_sha }})"
          git push
